name: CI (build + lint + unit tests + coverage)

on:
  push:
    branches: [ main, dev, "feature/**", "hotfix/**" ]
  pull_request:

jobs:
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2

  lint:
    name: Ktlint & Detekt
    runs-on: ubuntu-latest
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: chmod +x ./gradlew
      - name: ktlint check
        run: ./gradlew ktlintCheck --stacktrace
      - name: detekt
        run: ./gradlew detekt --stacktrace
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/ktlint/**
            **/build/reports/detekt/**

  build-test:
    name: Build, Unit tests & Coverage
    runs-on: ubuntu-latest
    needs: validate-wrapper
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: chmod +x ./gradlew

      # Build + run ALL unit tests (JVM modules: 'test', Android modules: 'testDebugUnitTest')
      - name: Build (assembleDebug) + unit tests
        run: |
          ./gradlew clean assembleDebug test testDebugUnitTest --stacktrace

      # Generate merged JaCoCo coverage (relies on the root 'jacocoMergedReport' task you added)
      - name: Generate merged coverage (JaCoCo)
        run: ./gradlew jacocoMergedReport --stacktrace

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

      - name: Upload coverage report (merged)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: |
            **/build/reports/jacoco/merged/html/**
            **/build/reports/jacoco/merged/merged.xml
