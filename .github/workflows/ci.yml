name: CI (build + lint + unit tests + coverage)

on:
  push:
    branches: [ main, dev, "feature/**", "hotfix/**" ]
  pull_request:

jobs:
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2

  # 🔒 Guard PR base to enforce your GitFlow:
  # feature/* -> dev, and dev -> main (blocks anything else)
  guard-pr-base:
    name: Guard PR base
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Enforce GitFlow base rules
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          HEAD="${{ github.event.pull_request.head.ref }}"

          case "$BASE" in
            main)
              if [ "$HEAD" != "dev" ]; then
                echo "❌ Only PRs from 'dev' can be merged into 'main' (got: '$HEAD' -> '$BASE')."
                exit 1
              fi
              ;;
            dev)
              if [[ ! "$HEAD" =~ ^feature/ ]]; then
                echo "❌ Only PRs from 'feature/*' can be merged into 'dev' (got: '$HEAD' -> '$BASE')."
                exit 1
              fi
              ;;
            *)
              echo "ℹ️ No guard for base '$BASE'."
              ;;
          esac

  lint:
    name: Ktlint & Detekt
    runs-on: ubuntu-latest
    needs: [validate-wrapper, guard-pr-base]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: chmod +x ./gradlew
      - name: ktlint check
        run: ./gradlew ktlintCheck --stacktrace
      - name: detekt
        run: ./gradlew detekt --stacktrace
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/ktlint/**
            **/build/reports/detekt/**

  build-test:
    name: Build, Unit tests & Coverage
    runs-on: ubuntu-latest
    needs: [validate-wrapper, guard-pr-base]
    timeout-minutes: 30
    env:
      GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: chmod +x ./gradlew

      # ✅ Decode google-services.json from secret
      - name: Restore google-services.json
        run: |
          if [ -z "$GOOGLE_SERVICES" ]; then
            echo "⚠️ GOOGLE_SERVICES secret is missing!"
            exit 1
          fi
          echo "$GOOGLE_SERVICES" | base64 --decode > app/google-services.json
          echo "✅ google-services.json restored to app/"

      - name: Build (assembleDebug) + unit tests
        run: |
          ./gradlew clean assembleDebug test testDebugUnitTest testReleaseUnitTest --stacktrace

      - name: Generate merged coverage (JaCoCo)
        run: ./gradlew jacocoMergedReport --stacktrace

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: warn

      - name: Upload coverage report (merged)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: |
            **/build/reports/jacoco/merged/html/**
            **/build/reports/jacoco/merged/merged.xml
          if-no-files-found: warn
