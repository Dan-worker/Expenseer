name: Release (tag → signed build + GitHub Release)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ✅ Guard: ensure tag commit belongs to 'main'
      - name: Ensure tag points to main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "❌ The tag must point to a commit contained in 'main'."; exit 1;
          fi
          echo "✅ Tag is on main."

      # 🔑 Restore keystore from secret
      - name: Decode signing keystore
        shell: bash
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      # 📦 Provide signing properties to Gradle
      - name: Configure signing properties
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties << 'EOF'
          MYAPP_STORE_FILE=keystore.jks
          MYAPP_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}
          MYAPP_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}
          MYAPP_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}
          EOF

      # 🏗 Build signed release (AAB + APK)
      - name: Build release
        run: |
          ./gradlew :app:clean :app:bundleRelease :app:assembleRelease --stacktrace

      # 📤 Upload artifacts
      - name: Upload release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      # 📝 Create GitHub Release and attach files
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
