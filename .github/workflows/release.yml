name: Release (tag → signed build + GitHub Release)

on:
  push:
    tags:
      - "v*"   # we’ll further validate the pattern inside

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── Guard: validate tag name & ancestry, but DO NOT fail the job ─────────────
      - name: Validate tag (semver-ish) and ensure it points to main
        id: guard
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

          # 1) (Optional) semver-ish check: vMAJOR.MINOR.PATCH
          #    Loosen or tighten as you like.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not semver-like (vMAJOR.MINOR.PATCH). Will skip release."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2) Ensure tag commit is contained in 'main'
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "Tag commit is on main ✅"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag commit is NOT on main. Will skip release."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # From here on, only run if guard passed
      - name: Decode signing keystore
        if: steps.guard.outputs.ok == 'true'
        shell: bash
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Configure signing properties
        if: steps.guard.outputs.ok == 'true'
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties << 'EOF'
          MYAPP_STORE_FILE=keystore.jks
          MYAPP_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}
          MYAPP_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}
          MYAPP_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}
          EOF

      - name: Build release (AAB + APK)
        if: steps.guard.outputs.ok == 'true'
        run: |
          ./gradlew :app:clean :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Upload artifacts
        if: steps.guard.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Create GitHub Release
        if: steps.guard.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      # Optional: a friendly summary when we skipped
      - name: Summary (skipped)
        if: steps.guard.outputs.ok != 'true'
        run: |
          echo "Release skipped. The tag must:"
          echo "  • match vMAJOR.MINOR.PATCH (e.g., v1.2.3)"
          echo "  • point to a commit contained in 'main'"
